<mat-toolbar color="primary">
    <span>Favorite Products</span>
  </mat-toolbar>
  
  <mat-card *ngFor="let product of favorites">
    <mat-card-title>{{ product.title }}</mat-card-title>
    <mat-card-subtitle>\${{ product.price }}</mat-card-subtitle>
    <mat-card-content>
      <p>{{ product.description }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="warn" (click)="removeFromFavorites(product.id)">Remove</button>
    </mat-card-actions>
  </mat-card>
  
  <div *ngIf="favorites.length === 0">
    <p>No favorites saved yet.</p>
  </div>
