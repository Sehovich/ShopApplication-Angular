<mat-toolbar color="primary">
    <span>Basket</span>
  </mat-toolbar>
  
  <mat-card *ngFor="let product of items">
    <mat-card-title>{{ product.title }}</mat-card-title>
    <mat-card-subtitle>\${{ product.price }}</mat-card-subtitle>
    <mat-card-content>
      <p>{{ product.description }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="warn" (click)="remove(product.id)">Remove</button>
    </mat-card-actions>
  </mat-card>
  
  <div *ngIf="items.length > 0" style="margin-top: 1rem;">
    <button mat-stroked-button color="warn" (click)="clear()">Clear Basket</button>
  </div>
  
  <div *ngIf="items.length === 0">
    <p>Your basket is empty.</p>
  </div>
