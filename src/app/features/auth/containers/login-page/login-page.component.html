<div class="auth-page">
  <h2 class="auth-title">AUTHENTICATION</h2>

  <div class="login-box">
    <h3 class="login-heading">Login your Account</h3>
    <hr class="divider" />

    <div class="social-login">
      <p class="social-label">Login with social account</p>
      <div class="social-buttons">
        <button class="social-btn">
          <i class="fi fi-brands-facebook"></i> <span>FACEBOOK</span>
        </button>
        <button class="social-btn">
          <i class="fi fi-brands-twitter"></i> <span>TWITTER</span>
        </button>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="form.email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="form.password"
          required
        />
      </div>

      <div class="form-extras">
        <label class="remember-me">
          <input type="checkbox" /> Remember me
        </label>
        <a class="forgot-link" href="#">Forgot password?</a>
      </div>

      <button type="submit" class="login-button">LOGIN</button>

      <div *ngIf="error" class="error-message">{{ error }}</div>
    </form>
  </div>
</div>
