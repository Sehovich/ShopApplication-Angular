<mat-toolbar color="primary">
  <span>Shop</span>
</mat-toolbar>

<div class="toolbar">
  <button mat-button (click)="toggleSort('title')">Sort by Title</button>
  <button mat-button (click)="toggleSort('price')">Sort by Price</button>
</div>

<div *ngIf="loading" class="loading">
  <mat-spinner diameter="50"></mat-spinner>
</div>

<div class="product-grid" *ngIf="!loading">
  <mat-card class="product-card" *ngFor="let product of products">
    <img mat-card-image [src]="product.thumbnail" />
    <mat-card-title>{{ product.title }}</mat-card-title>
    <mat-card-subtitle>\${{ product.price }}</mat-card-subtitle>
    <mat-card-content>
      <p>{{ product.description }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-icon-button (click)="toggleFavourite(product.id)">
        <mat-icon>{{ isFavourite(product.id) ? 'favorite' : 'favorite_border' }}</mat-icon>
      </button>
    
      <button mat-icon-button (click)="addToBasket(product.id)">
        <mat-icon>shopping_cart</mat-icon>
      </button>
    
      <a mat-button [routerLink]="['/products', product.id]">View</a>
    </mat-card-actions>
    
  </mat-card>
</div>

<div class="pagination">
  <button mat-stroked-button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">
    Prev
  </button>
  <span class="page-number">Page {{ currentPage }}</span>
  <button mat-stroked-button (click)="changePage(currentPage + 1)" [disabled]="products.length < pageSize">
    Next
  </button>
</div>
