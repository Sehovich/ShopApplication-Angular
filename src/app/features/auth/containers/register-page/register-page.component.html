<div class="register-box">
  <h2 class="form-title">Register your Account</h2>
  <hr class="divider" />
  <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" [(ngModel)]="form.email" required />
    </div>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" [(ngModel)]="form.username" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" [(ngModel)]="form.password" required />
    </div>

    <button type="submit" class="register-button">Register</button>

    <div *ngIf="error" class="error-msg">{{ error }}</div>
    <div *ngIf="success" class="success-msg">{{ success }}</div>
  </form>
</div>
