<div class="register-container">
  <h2>Register</h2>
  <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
    <mat-form-field class="w-full">
      <mat-label>Email</mat-label>
      <input matInput type="email" name="email" [(ngModel)]="form.email" required />
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Username</mat-label>
      <input matInput type="text" name="username" [(ngModel)]="form.username" required />
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Password</mat-label>
      <input matInput type="password" name="password" [(ngModel)]="form.password" required />
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit">Register</button>

    <div *ngIf="error" class="text-red-500 mt-2">{{ error }}</div>
    <div *ngIf="success" class="text-green-600 mt-2">{{ success }}</div>
  </form>
</div>
