<mat-toolbar color="accent">
  <span>My Favorite Products</span>
</mat-toolbar>

<div *ngIf="favoriteProducts.length === 0" class="empty">
  <p>You haven't added any favorite products yet.</p>
</div>

<div class="product-grid" *ngIf="favoriteProducts.length > 0">
  <mat-card class="product-card" *ngFor="let product of favoriteProducts">
    <img mat-card-image [src]="product.thumbnail" />
    <mat-card-title>{{ product.title }}</mat-card-title>
    <mat-card-subtitle>\${{ product.price }}</mat-card-subtitle>
    <mat-card-content>
      <p>{{ product.description }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="primary" (click)="addToBasket(product.id)">
        <mat-icon>shopping_cart</mat-icon> Add to Basket
      </button>
      <a mat-button [routerLink]="['/products', product.id]">View</a>
    </mat-card-actions>
  </mat-card>
</div>
